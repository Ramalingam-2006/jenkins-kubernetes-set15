
apiVersion: apps/v1
kind: Deployment
metadata:
  name: final-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: final-web
  template:
    metadata:
      labels:
        app: final-web
    spec:
      containers:
        - name: web
          image: ramalingam2006/jenkins-kubernetes-set15:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: final-web-service
spec:
  type: NodePort
  selector:
    app: final-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
